<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0" />
    <title>qml-renderer</title>
    <style>
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100%; background: #fff; }
      #screen { width: 100%; height: 100%; }
      #spinner {
        position: absolute; inset: 0; display: flex; align-items: center;
        justify-content: center; font: 13px/1.4 -apple-system, sans-serif;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div id="spinner">Loading Qt-WASM renderer…</div>
    <div id="screen"></div>

    <script src="qml-renderer.js"></script>
    <script src="qtloader.js"></script>
    <script>
      // Boot Qt-WASM, then accept QML source updates via postMessage from the
      // parent window (the Next.js builder app). Each message replaces the
      // visible QML — the renderer handles error fallbacks.
      let qtModule = null;
      const pending = [];

      console.log("[renderer] script loaded, attaching message listener");

      (async () => {
        try {
          console.log("[renderer] calling qtLoad...");
          qtModule = await qtLoad({
            qt: {
              onLoaded: () => {
                console.log("[renderer] onLoaded fired (qtModule still null at this point)");
                document.getElementById("spinner").style.display = "none";
              },
              onExit: (e) => {
                console.log("[renderer] onExit:", e);
                document.getElementById("spinner").textContent =
                  "Renderer exited: " + (e.text || e.code || "(unknown)");
                document.getElementById("spinner").style.display = "flex";
              },
              entryFunction: window.qml_renderer_entry,
              containerElements: [document.getElementById("screen")],
            },
          });
          console.log("[renderer] qtLoad resolved. qtModule:", qtModule, "has loadQml:", typeof qtModule?.loadQml);
          console.log("[renderer] draining pending queue, length:", pending.length);
          while (pending.length) {
            const src = pending.shift();
            try {
              qtModule.loadQml(src);
              console.log("[renderer] drained loadQml ok, length:", src.length);
            } catch (e) { console.error("[renderer] drain loadQml threw:", e); }
          }
          console.log("[renderer] posting renderer-ready to parent");
          try {
            window.parent.postMessage({ type: "renderer-ready" }, "*");
          } catch (e) { console.error("[renderer] parent postMessage threw:", e); }
        } catch (e) {
          console.error("[renderer] qtLoad failed:", e);
          document.getElementById("spinner").textContent = "Renderer failed: " + e;
        }
      })();

      window.addEventListener("message", (ev) => {
        const data = ev.data;
        if (!data || data.type !== "loadQml" || typeof data.source !== "string") return;
        console.log("[renderer] received loadQml message, qtModule ready:", !!qtModule, "source length:", data.source.length);
        if (!qtModule) {
          pending.push(data.source);
          console.log("[renderer] queued (pending length now:", pending.length, ")");
          return;
        }
        try {
          qtModule.loadQml(data.source);
          console.log("[renderer] loadQml ok");
        } catch (e) { console.error("[renderer] loadQml threw:", e); }
      });
    </script>
  </body>
</html>
